version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: babel-feed-db-dev
    environment:
      POSTGRES_DB: babel_feed_dev
      POSTGRES_USER: babel_dev
      POSTGRES_PASSWORD: babel_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - babel_feed_dev_data:/var/lib/postgresql/data
      - ./apps/babel-api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babel_dev -d babel_feed_dev"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - babel-dev

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: babel-feed-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@babelfeed.com
      PGADMIN_DEFAULT_PASSWORD: dev123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - babel-dev
    profiles:
      - tools  # Only start with --profile tools

volumes:
  babel_feed_dev_data:
    driver: local

networks:
  babel-dev:
    driver: bridge