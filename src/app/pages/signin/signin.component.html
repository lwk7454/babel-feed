<div class="signin-container">
  <!-- Logo and title -->
  <div class="signin-header">
    <div class="logo-placeholder">📰</div>
    <h1 class="app-title">Babel Feed</h1>
    <p class="signin-subtitle">Sign in to continue</p>
  </div>

  <!-- Error messages -->
  <div class="messages-section" *ngIf="messages.length > 0">
    <p-messages [(value)]="messages" [enableService]="false" [closable]="true" styleClass="auth-messages"></p-messages>
  </div>

  <!-- Sign in section -->
  <div class="signin-section">
    <!-- Loading state -->
    <div *ngIf="loading$ | async" class="loading-container">
      <p-progressSpinner strokeWidth="3" animationDuration=".8s"></p-progressSpinner>
      <p class="loading-text">Signing you in...</p>
    </div>

    <!-- Sign in button -->
    <div *ngIf="!(loading$ | async)" class="signin-actions">
      <p-button 
        label="Sign In with Google"
        icon="pi pi-google"
        iconPos="left"
        (onClick)="signInWithGoogle()"
        styleClass="google-signin-btn">
      </p-button>
    </div>
  </div>

  <!-- Dev-only skip button -->
  <div class="dev-skip-toggle">
    <p-button 
      label="Skip (Dev)"
      icon="pi pi-fast-forward"
      (click)="skipLoginForDev()"
      styleClass="p-button-rounded p-button-warning p-button-text skip-btn"
      aria-label="Skip login for development">
    </p-button>
  </div>

  <!-- Theme toggle button -->
  <div class="theme-toggle">
    <p-button 
      [icon]="themeService.getCurrentTheme() === 'light' ? 'pi pi-moon' : 'pi pi-sun'" 
      (click)="themeService.toggleTheme()" 
      styleClass="p-button-rounded p-button-text theme-btn"
      aria-label="Toggle theme">
    </p-button>
  </div>
</div>
