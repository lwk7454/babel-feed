<div @fadeInOut class="welcome-container">
  <!-- Logo and title -->
  <div class="welcome-header">
    <div class="logo-placeholder">📰</div>
    <h1 class="app-title">Babel Feed</h1>
    <p class="app-subtitle">Your News, Effortlessly Translated.</p>
  </div>

  <!-- Language selection -->
  <div class="language-section">
    <h3 class="language-prompt">Choose your preferred language:</h3>
    
    <div class="language-grid">
      <button 
        *ngFor="let option of (languageOptions$ | async) || []"
        class="language-option"
        [class.selected]="currentSelectedLanguage?.id === option.value.id"
        (click)="onLanguageSelect(option.value)">
        {{ option.label }}
      </button>
    </div>

    <!-- Get Started Button -->
    <p-button 
      label="Get Started"
      icon="pi pi-arrow-right"
      iconPos="right"
      (onClick)="goToSignIn()"
      [disabled]="!currentSelectedLanguage"
      styleClass="get-started-btn">
    </p-button>
  </div>

  <!-- Theme toggle button -->
  <div class="theme-toggle">
    <p-button 
      [icon]="themeService.getCurrentTheme() === 'light' ? 'pi pi-moon' : 'pi pi-sun'" 
      (click)="themeService.toggleTheme()" 
      styleClass="p-button-rounded p-button-text theme-btn"
      aria-label="Toggle theme">
    </p-button>
  </div>
</div>
