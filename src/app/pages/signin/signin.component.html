<div class="app-container signin-container">
  <h1>Sign in to continue</h1>
  
  <div class="signin-options">
    <button class="signin-button" (click)="signIn('google')">
      Google sign in
    </button>
    
    <button class="signin-button" (click)="signIn('apple')">
      Apple sign in
    </button>
    
    <button class="signin-button" (click)="signIn('wechat')">
      Wechat sign in
    </button>
  </div>
</div>
