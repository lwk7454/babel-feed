<div @fadeInOut class="page-container container-centered">
  <!-- Logo and title -->
  <div class="header">
    <div class="header-icon">📰</div>
    <h1 class="header-title">Babel Feed</h1>
    <p class="header-subtitle">Your News, Effortlessly Translated.</p>
  </div>

  <!-- Language selection -->
  <div class="section">
    <h3 class="section-title">Choose your preferred language:</h3>
    
    <div class="grid grid-2 mb-4xl">
      <button 
        *ngFor="let option of (languageOptions$ | async) || []"
        class="selection-option"
        [class.selected]="currentSelectedLanguage?.id === option.value.id"
        (click)="onLanguageSelect(option.value)">
        {{ option.label }}
      </button>
    </div>

    <!-- Get Started Button -->
    <p-button 
      label="Get Started"
      icon="pi pi-arrow-right"
      iconPos="right"
      (onClick)="goToSignIn()"
      [disabled]="!currentSelectedLanguage"
      styleClass="btn-primary">
    </p-button>
  </div>

  <!-- Theme toggle button -->
  <div class="fixed-bottom-right">
    <p-button 
      [icon]="themeService.getCurrentTheme() === 'light' ? 'pi pi-moon' : 'pi pi-sun'" 
      (click)="themeService.toggleTheme()" 
      styleClass="p-button-rounded p-button-text btn-secondary"
      aria-label="Toggle theme">
    </p-button>
  </div>
</div>
