<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Content Test</title>
</head>
<body>
    <h1>Dynamic Content Test</h1>
    <div id="content-container">
        <p id="initial-content">Initial content that will change</p>
    </div>
    
    <div id="dynamic-list">
        <!-- Items will be added dynamically -->
    </div>
    
    <script>
        // Simulate React-like dynamic content updates
        let updateCount = 0;
        
        window.simulateContentUpdate = function() {
            updateCount++;
            const container = document.getElementById('content-container');
            const newContent = document.createElement('p');
            newContent.id = 'dynamic-content-' + updateCount;
            newContent.textContent = 'Dynamic content update #' + updateCount + ' - 这是动态内容 - 動的コンテンツ';
            container.appendChild(newContent);
        };
        
        window.simulateListUpdate = function() {
            const list = document.getElementById('dynamic-list');
            const item = document.createElement('div');
            item.className = 'dynamic-item';
            item.innerHTML = `
                <h3>Item ${Date.now()}</h3>
                <p>Content: Hello 世界 ${Math.random()}</p>
            `;
            list.appendChild(item);
        };
        
        window.simulateRapidUpdates = function(count = 5) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => {
                    simulateContentUpdate();
                    simulateListUpdate();
                }, i * 100); // 100ms intervals
            }
        };
        
        // Simulate component mounting
        window.simulateComponentMount = function() {
            const mountPoint = document.createElement('div');
            mountPoint.id = 'mounted-component';
            mountPoint.innerHTML = `
                <h2>Mounted Component</h2>
                <p>这个组件是动态挂载的 - This component was mounted dynamically</p>
                <p>日本語のテキストも含まれています - Japanese text is also included</p>
            `;
            document.body.appendChild(mountPoint);
        };
    </script>
</body>
</html>
