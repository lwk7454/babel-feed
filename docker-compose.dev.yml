version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: babel-feed-db-dev
    environment:
      POSTGRES_DB: babel_feed_dev
      POSTGRES_USER: babel_dev
      POSTGRES_PASSWORD: babel_dev_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - babel_feed_dev_data:/var/lib/postgresql/data
      - ./apps/babel-api/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babel_dev -d babel_feed_dev"]
      interval: 3s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - babel-dev

volumes:
  babel_feed_dev_data:
    driver: local

networks:
  babel-dev:
    driver: bridge